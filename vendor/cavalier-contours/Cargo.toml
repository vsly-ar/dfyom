# The cavalier_contours crate behind our thin C ABI, built for wasm32-unknown-unknown without
# wasm-bindgen or imports (ADR 0019, docs/decisions/0019-2d-geometry-library.md). The built module
# is vendored next to this file with its SHA-256; rebuild it with `npm run wasm:cavalier`
# (scripts/build-cavalier-wasm.mjs). Doc: docs/architecture/shapes.md#2d-port
[package]
name = "dfyom_cavalier"
version = "1.0.0"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false

[lib]
crate-type = ["cdylib"]
path = "src/lib.rs"

[dependencies]
# Pinned exactly; Cargo.lock pins every transitive crate with its checksum.
cavalier_contours = "=0.9.0"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
